name: fishing_cat_game
description: "fishing cat game"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.3
  flutter_dotenv: ^6.0.1
  # stable 6.1.5는 AGP 9에서 proguard-android.txt 미지원으로 Android 빌드 실패 → stable 출시 시 교체
  flutter_inappwebview: 6.2.0-beta.3
  share_plus: ^13.3.1
  intl: ^0.20.3

# 네이티브 스플래시는 검은 화면만 보여 주고, mocadev 로고(splash.png) 페이드인은
# Flutter의 SplashOverlay가 맡는다.
flutter_native_splash:
  color: "#000000"
  android: true
  ios: true
  android_12:
    color: "#000000"
    # Android 12+는 이미지가 없으면 앱 아이콘을 띄우므로 투명 이미지로 비워 둔다.
    image: "assets/icons/splash_blank.png"
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
  web: false

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.12.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  # icon.png는 직접 제작한 1024 풀블리드 원본이다.
  # icon_foreground.png는 원본을 적응형 아이콘 안전 영역(108dp 중 72dp)에 맞춰 축소한 이미지.
  adaptive_icon_background: "#5ECCE2"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - .env
    # 게임 자산은 tool/sync_game_assets.dart 로 games/ 에서 동기화된다.
    - assets/game/
    - assets/game/assets/
    - assets/game/assets/backgrounds/
    - assets/game/assets/sounds/
    - assets/game/fonts/
