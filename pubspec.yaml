name: catfishing
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.3
  flutter_dotenv: ^6.0.1
  flutter_inappwebview: 6.2.0-beta.3

flutter_native_splash:
  color: "#000000"
  image: "assets/icons/splash.png"
  android: true
  ios: true
  android_12:
    color: "#000000"
    # Android 12+는 스플래시 아이콘을 중앙 2/3 원으로 마스킹하므로 여백을 넣은 전용 이미지를 사용
    image: "assets/icons/splash_android12.png"
  fullscreen: false
  android_gravity: center
  ios_content_mode: center
  web: false

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.12.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/icon.png"
  min_sdk_android: 21

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - .env
    # 게임 자산은 tool/sync_game_assets.dart 로 games/ 에서 동기화된다.
    - assets/game/
    - assets/game/assets/
    - assets/game/assets/backgrounds/
    - assets/game/fonts/

