name: fishing_cat_game
description: "fishing cat game"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.3
  flutter_dotenv: ^6.0.1
  # stable 6.1.5는 AGP 9에서 proguard-android.txt 미지원으로 Android 빌드 실패 → stable 출시 시 교체
  flutter_inappwebview: 6.2.0-beta.3
  share_plus: ^13.3.1
  intl: ^0.20.3

# 스플래시 이미지(검정 배경 mocadev 로고)는 직접 제작한 에셋이다.
# splash_android12.png는 splash.png의 로고를 Android 12 마스크 원 안에 맞춰 축소한 이미지.
flutter_native_splash:
  color: "#000000"
  image: "assets/icons/splash.png"
  android: true
  ios: true
  android_12:
    color: "#000000"
    # Android 12+는 스플래시 아이콘을 중앙 2/3 원으로 마스킹하므로 여백을 넣은 전용 이미지를 사용
    image: "assets/icons/splash_android12.png"
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
  web: false

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.12.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  # 아이콘 원본은 python tool/make_icon.py 로 생성한다.
  adaptive_icon_background: "#96D7F0"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - .env
    # 게임 자산은 tool/sync_game_assets.dart 로 games/ 에서 동기화된다.
    - assets/game/
    - assets/game/assets/
    - assets/game/assets/backgrounds/
    - assets/game/assets/sounds/
    - assets/game/fonts/
